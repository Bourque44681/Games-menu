<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>Typing</title>
        <meta charset = "UTF-8">
        <link rel = "stylesheet" href = "Typing.css"> 
    </head>
    <body>
        <div id = "TypingBox" class = "Background">
            <div id = "info">
                <h1 id = "timer">Time: <span id = "timeValue">25</span></h1>
                <div id = "showTypingLine"></div>

                <div class = "button" id = "easy"></div>
                <div class = "button" id = "medium"></div>
                <div class = "button" id = "hard"></div>

            </div>




            <div id = "textbox">
                <p id = "Words"></p>
                <!-- <input type = "text" id = "word-input" autocomplete="off" autofocus> -->
            </div>
        </div>
        
        <div id = "resultBox">
            <div id = "resultInfoBox"><h2> Results</h2></div>
            <h1 id = "wpm">WPM:&nbsp;&nbsp;<span id = "wpmVal">0</span></h1>
            <h1 id = "Accuracy">Accuracy:&nbsp;&nbsp;<span id = "AccuracyVal">0</span></h1>
            <h1 id = "WordsTyped">Words Typed:&nbsp;&nbsp;<span id = "WordsTypedVal">0</span></h1>
            <h1 id = "CharactersTyped">Characters Typed:&nbsp;&nbsp;<span id = "CahractersTypedVal">0</span></h1>
            <h1 id = "Typos">Typos:&nbsp;&nbsp;<span id = "TyposVal">0</span></h1>
        </div>

        <script src = "Typing.js"></script>
    </body>
</html>
